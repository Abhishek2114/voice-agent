[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = backend/tests tests
pythonpath = backend .
addopts = -p no:cacheprovider
filterwarnings =
    ignore::DeprecationWarning:aioice.*
markers =
    ollama: requires a running local Ollama server with a model (skipped in CI)
    speech: requires local whisper.cpp / piper / macOS speech (skipped in CI)
    slow: slow benchmark-style tests
